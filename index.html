!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure System Terminal</title>

<style>
body {
    margin: 0;
    background: black;
    color: #00ff9c;
    font-family: Consolas, monospace;
    overflow: hidden;
}

#startScreen {
    position: absolute;
    width: 100%;
    height: 100%;
    background: black;
    color: #00ff9c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
}

#terminal {
    padding: 20px;
    font-size: 15px;
    white-space: pre-wrap;
    display: none;
}

.progress {
    width: 100%;
    background: #111;
    border: 1px solid #00ff9c;
    margin: 10px 0;
}

.bar {
    height: 8px;
    width: 0%;
    background: #00ff9c;
}
</style>
</head>

<body>

<div id="startScreen">Click to Initialize Secure System</div>
<div id="terminal"></div>

<!-- Sounds -->
<audio id="typingSound" src="https://www.soundjay.com/mechanical/keyboard-1.mp3" loop></audio>
<audio id="humSound" src="https://www.soundjay.com/ambient/ambient-computer-hum.mp3" loop></audio>
<audio id="glitchSound" src="https://www.soundjay.com/button/beep-07.mp3"></audio>

<script>
const startScreen = document.getElementById("startScreen");
const term = document.getElementById("terminal");

const typingSound = document.getElementById("typingSound");
const humSound = document.getElementById("humSound");
const glitchSound = document.getElementById("glitchSound");

startScreen.onclick = () => {
    startScreen.style.display = "none";
    term.style.display = "block";

    typingSound.volume = 0.2;
    humSound.volume = 0.3;

    typingSound.play();
    humSound.play();

    start();
};

function type(text, speed = 20) {
    return new Promise(resolve => {
        let i = 0;
        function typing() {
            if (i < text.length) {
                term.innerHTML += text.charAt(i);
                i++;
                setTimeout(typing, speed);
            } else {
                term.innerHTML += "\n";
                resolve();
            }
        }
        typing();
    });
}

function delay(ms) {
    return new Promise(res => setTimeout(res, ms));
}

function rand(min,max){
    return Math.floor(Math.random()*(max-min)+min);
}

function randomIP() {
    return `${rand(10,255)}.${rand(0,255)}.${rand(0,255)}.${rand(0,255)}`;
}

async function bootSequence() {
    await type("[BOOT] Initializing kernel...");
    await delay(300);
    await type("[BOOT] Loading modules...");
    await delay(500);
    await type("[OK] CPU cores: " + rand(2,16));
    await type("[OK] Memory check passed");
    await delay(400);
}

async function hackingSequence() {
    await type("[CONNECT] Establishing secure tunnel...");
    await delay(500);

    await type("[SCAN] Target IP: " + randomIP());
    await delay(400);

    await type("[SCAN] Searching vulnerabilities...");
    await delay(600);

    await type("[FOUND] Exploit located...");
    await delay(500);

    await type("[ATTACK] Injecting payload...");
    await delay(500);

    await progressBar();

    await type("[CRACK] Decrypting...");
    await delay(600);

    await type("[SUCCESS] Access granted.");
    await delay(500);

    await type("[EXTRACT] Downloading files...");
    await progressBar();

    reveal();
}

function progressBar() {
    return new Promise(resolve => {
        let container = document.createElement("div");
        container.className = "progress";
        let bar = document.createElement("div");
        bar.className = "bar";
        container.appendChild(bar);
        term.appendChild(container);

        let width = 0;
        let interval = setInterval(() => {
            width += Math.random()*8;
            bar.style.width = width + "%";

            if (width >= 100) {
                clearInterval(interval);
                resolve();
            }
        }, 120);
    });
}

function reveal() {
    typingSound.pause();
    glitchSound.play();

    setTimeout(() => {
        term.innerHTML += "\n\n[SYSTEM BREACH COMPLETE]\n";
        term.innerHTML += "😎 Relax — just a prank.\n";
        term.innerHTML += "Nothing was hacked.\n";
    }, 800);
}

async function start() {
    await bootSequence();
    await hackingSequence();
}
</script>

</body>
</html>
body {
  animation: flicker 0.1s infinite;
}

@keyframes flicker {
  0% { opacity: 1; }
  50% { opacity: 0.98; }
  100% { opacity: 1; }
}
